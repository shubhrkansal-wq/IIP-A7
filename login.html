<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
  }
  .form-box {
    width: 300px;
    margin: 60px auto;
    background-color: #ffffff;
    padding: 20px;
    border: 1px solid #999;
  }
  h2 {
    text-align: center;
  }
  label {
    display: block;
    margin-top: 12px;
  }
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 5px;
    margin-top: 4px;
  }
  input[type="submit"] {
    margin-top: 15px;
    padding: 8px 20px;
  }
</style>
</head>
<body>

<div class="form-box">
  <h2>Login</h2>
  <form action="#" method="post">

    <label>Username:</label>
    <input type="text" name="username" minlength="4" maxlength="12">

    <label title="Password must be 8 to 15 characters, with at least one number and one capital letter">
      Password: (hover for rules)
    </label>
    <input type="password" name="password" minlength="8" maxlength="15"
           title="Must be 8 to 15 characters, include one number and one capital letter">

    <br>
    <input type="submit" value="Login">

  </form>
</div>

</body>
</html>
