<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Layout 2 - Intro and Three Boxes</title>
<style>

  html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  /* the whole page is a flex column */
  .page {
    display: flex;              /* flexbox used here */
    flex-direction: column;
    height: 100vh;
    background-color: #f2f2f2;
    padding: 10px;
    box-sizing: border-box;
    gap: 8px;
  }

  .box {
    background-color: #d9d9d9;
    border: 1px solid #bbbbbb;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* logo and navigation sit side by side */
  .top-row {
    display: flex;              /* flexbox used here */
    gap: 8px;
    height: 50px;
  }

  .top-row .box {
    flex: 1;                    /* logo and nav split the row equally */
  }

  .header {
    height: 90px;
  }

  .intro {
    height: 60px;
  }

  /* three boxes side by side, sharing remaining space */
  .boxes-row {
    display: flex;              /* flexbox used here */
    flex: 1;
    gap: 8px;
  }

  .boxes-row .box {
    flex: 1;                    /* each box gets equal width */
  }

  .footer {
    height: 45px;
  }

</style>
</head>
<body>

  <div class="page">

    <div class="top-row">
      <div class="box">Logo</div>
      <div class="box">Navigation</div>
    </div>

    <div class="box header">Header / Banner</div>
    <div class="box intro">Intro Text Area</div>

    <div class="boxes-row">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </div>

    <div class="box footer">Footer</div>

  </div>

</body>
</html>
