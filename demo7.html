<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Layout 3 - Sidebar Navigation</title>
<style>

  html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
  }

  /* the whole page is a flex column */
  .page {
    display: flex;              /* flexbox used here */
    flex-direction: column;
    height: 100vh;
    background-color: #f2f2f2;
    padding: 10px;
    box-sizing: border-box;
    gap: 8px;
  }

  .box {
    background-color: #d9d9d9;
    border: 1px solid #bbbbbb;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .logo {
    height: 60px;
  }

  .footer {
    height: 45px;
  }

  /* row containing the sidebar nav and the right side column */
  .main-row {
    display: flex;              /* flexbox used here */
    flex: 1;
    gap: 8px;
  }

  .sidebar-nav {
    background-color: #d9d9d9;
    border: 1px solid #bbbbbb;
    width: 20%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  /* right column stacks header on top of body */
  .right-column {
    flex: 1;                    /* takes remaining width */
    display: flex;              /* flexbox used here too, but as a column */
    flex-direction: column;
    gap: 8px;
  }

  .header {
    height: 90px;
  }

  .body-area {
    background-color: #cfcfcf;
    border: 1px solid #bbbbbb;
    flex: 1;                    /* takes remaining height */
    display: flex;
    justify-content: center;
    align-items: center;
  }

</style>
</head>
<body>

  <div class="page">

    <div class="box logo">Logo</div>

    <div class="main-row">

      <div class="sidebar-nav">Side Bar<br>Navigation</div>

      <div class="right-column">
        <div class="box header">Header / Banner</div>
        <div class="body-area">Body Area</div>
      </div>

    </div>

    <div class="box footer">Footer</div>

  </div>

</body>
</html>
