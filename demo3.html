<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS- Font | Text | CSS Box Model(w/h/m/p/b)</title>
    <style>
        h1{
            color: blue !important;
            background-color: antiquewhite;
        font-family: times new roman;
            /*font-size: 5em;*/
            font-weight: 100;
            font-style: italic;
        }
        p{
            text-align: left;
            text-decoration: line-through;
            text-transform: capitalize;
            text-shadow: 0px 1px 2px #986a76;
            text-indent: 90px; 
        }
        #box{
            width: 200px;
            height: 200px;
            background: #CCC;
            border: 5px solid #000;
            margin: 0px 10px 6px 5px;
            padding: 10px 35px;
        }
    </style>
</head>
<body>
    <!-- css - inline / internal and external -->
     <h1 style="font-size: 4em; color: rgb rgb(191, 35, 124);">Hello World!</h1>
<p>
    Kiet is a university located in ghaziabad, uttar pradesh
</p>
<!-- box model -->
    <div id="box">
<p>
        KIET UNIVERSITY local address is muradnagar.
</p>
    </div>
</body>
</html>
